<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LingShu">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0b0f0e" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="#0b0f0e"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <!-- 经脉线（meridian lines） -->
  <path d="M-20 312 C 220 250, 420 340, 640 292 S 1020 210, 1240 268" stroke="#182420" stroke-width="2" fill="none"/>
  <path d="M-20 338 C 260 300, 460 356, 700 322 S 1060 268, 1240 316" stroke="#131c19" stroke-width="2" fill="none"/>
  <path d="M-20 60 C 240 110, 480 28, 760 76 S 1080 120, 1240 58" stroke="#131c19" stroke-width="2" fill="none"/>

  <!-- 穴位光点（acupoint nodes） -->
  <g filter="url(#nodeGlow)">
    <circle cx="228" cy="272" r="5" fill="#34d399"/>
    <circle cx="452" cy="314" r="4" fill="#2dd4bf"/>
    <circle cx="640" cy="292" r="6" fill="#34d399"/>
    <circle cx="852" cy="252" r="4" fill="#22d3ee"/>
    <circle cx="1058" cy="224" r="5" fill="#34d399"/>
    <circle cx="760" cy="76" r="4" fill="#2dd4bf"/>
    <circle cx="1064" cy="112" r="4" fill="#22d3ee"/>
  </g>
  <g fill="#a7f3d0" opacity="0.9">
    <circle cx="228" cy="272" r="1.8"/>
    <circle cx="640" cy="292" r="2.2"/>
    <circle cx="1058" cy="224" r="1.8"/>
  </g>

  <!-- 字标 -->
  <text x="600" y="196" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="128" font-weight="700" letter-spacing="10"
        fill="url(#wordmark)">灵枢</text>
  <text x="600" y="268" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="22"
        fill="none" stroke="url(#wordmark)" stroke-width="1.6">LINGSHU</text>
</svg>
